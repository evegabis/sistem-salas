<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Escolar</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f2f2f2;
}

header{
  background:linear-gradient(135deg,#6b0f1a,#3a3a3a);
  color:white;
  text-align:center;
  padding:18px;
}

header h1{margin:0;font-size:18px;}
header h2{margin:5px 0;font-size:14px;}

.card{
  background:white;
  margin:12px;
  padding:12px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input, select{
  width:100%;
  padding:8px;
  margin:6px 0;
}

.opcao{
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  text-align:center;
  cursor:pointer;
  font-weight:bold;
}

.ok{background:#c8f7c5;}
.mid{background:#eee;}
.bad{background:#f8c6c6;}

.selecionado{
  border:3px solid #6b0f1a;
}

button{
  width:100%;
  padding:10px;
  background:#6b0f1a;
  color:white;
  border:none;
  border-radius:8px;
}

#admin{display:none;}

.erro{
  color:red;
  font-size:13px;
}
</style>
</head>

<body>

<header>
<h1>Colégio Estadual Arlina Ferreira Crepive</h1>
<h2>Projeto Clube das Meninas</h2>
</header>

<div class="card">

<h3>Avaliação</h3>

<!-- 👇 NOME -->
<input type="text" id="nome" placeholder="Seu nome">

<!-- TURMA -->
<select id="turma">
<option>6A</option><option>6B</option><option>6C</option><option>6D</option>
<option>7A</option><option>7B</option><option>7C</option><option>7D</option>
<option>8A</option><option>8B</option><option>8C</option><option>8D</option>
<option>9A</option><option>9B</option><option>9C</option>
<option>1A</option><option>1B</option><option>1C</option>
<option>2A</option><option>2B</option><option>2C</option>
<option>3A</option><option>3B</option><option>3C</option>
</select>

<h4>Lixo</h4>
<div class="opcao lixo ok" onclick="set('lixo',2,this)">Excelente (+2)</div>
<div class="opcao lixo mid" onclick="set('lixo',1,this)">Bom (+1)</div>
<div class="opcao lixo mid" onclick="set('lixo',0,this)">Regular (0)</div>
<div class="opcao lixo bad" onclick="set('lixo',-2,this)">Ruim (-2)</div>

<h4>Carteiras</h4>
<div class="opcao car ok" onclick="set('car',3,this)">Excelente (+3)</div>
<div class="opcao car mid" onclick="set('car',1,this)">Bom (+1)</div>
<div class="opcao car mid" onclick="set('car',0,this)">Regular (0)</div>
<div class="opcao car bad" onclick="set('car',-2,this)">Ruim (-2)</div>

<h4>Paredes</h4>
<div class="opcao wall ok" onclick="set('wall',2,this)">Excelente (+2)</div>
<div class="opcao wall mid" onclick="set('wall',1,this)">Bom (+1)</div>
<div class="opcao wall mid" onclick="set('wall',0,this)">Regular (0)</div>
<div class="opcao wall bad" onclick="set('wall',-2,this)">Ruim (-2)</div>

<button onclick="salvar()">Salvar</button>
<p id="msg" class="erro"></p>

</div>

<div class="card">
<h3>Admin</h3>
<input type="password" id="senha" placeholder="Senha">
<button onclick="login()">Entrar</button>
</div>

<div class="card" id="admin">
<h3>Relatório</h3>
<button onclick="ver()">Ver dados</button>
<div id="res"></div>
</div>

<script>
let dados = JSON.parse(localStorage.getItem("dados") || "[]");

let estado = {
  lixo:null,
  car:null,
  wall:null
};

function set(tipo, valor, el){
  estado[tipo]=valor;

  document.querySelectorAll("."+tipo).forEach(e=>{
    e.classList.remove("selecionado");
  });

  el.classList.add("selecionado");
}

function salvar(){
  let msg=document.getElementById("msg");

  let nome=document.getElementById("nome").value;
  let turma=document.getElementById("turma").value;

  if(!nome || estado.lixo===null || estado.car===null || estado.wall===null){
    msg.innerText="Preencha tudo antes de salvar!";
    return;
  }

  msg.innerText="";

  let total = estado.lixo + estado.car + estado.wall;

  dados.push({
    nome:nome,
    turma:turma,
    pontos:total,
    data:new Date().toLocaleString()
  });

  localStorage.setItem("dados",JSON.stringify(dados));

  alert("Salvo com sucesso!");
}

function login(){
  if(document.getElementById("senha").value==="2312"){
    document.getElementById("admin").style.display="block";
  } else {
    alert("Senha errada");
  }
}

function ver(){
  let total=0;
  let porTurma={};

  dados.forEach(d=>{
    total+=d.pontos;
    porTurma[d.turma]=(porTurma[d.turma]||0)+d.pontos;
  });

  let html=`<p>Total geral: ${total}</p>`;

  for(let t in porTurma){
    html+=`<p>${t} → ${porTurma[t]}</p>`;
  }

  document.getElementById("res").innerHTML=html;
}
</script>

</body>
</html>
