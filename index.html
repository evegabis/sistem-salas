<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sistema Escolar - Clube da Ciência</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f4f4;
}

/* CABEÇALHO */
header {
  background: #6b0f1a;
  color: white;
  text-align: center;
  padding: 20px;
}

/* CONTAINER */
.container {
  padding: 20px;
}

/* CARD */
.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

/* BOTÃO */
button {
  background: #6b0f1a;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #4e0b13;
}

/* INPUT */
input, select {
  width: 100%;
  padding: 8px;
  margin: 5px 0 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

/* ADMIN */
#adminPanel {
  display: none;
  border: 2px solid #6b0f1a;
}
</style>
</head>

<body>

<header>
<h1>Colégio Arlinda Ferreira Crepini</h1>
<p>Projeto Meninas Clube da Ciência</p>
<p>Sistema de Avaliação Escolar</p>
</header>

<div class="container">

<!-- LOGIN ADMIN -->
<div class="card">
<h2>Acesso Administrador</h2>
<input type="password" id="senha" placeholder="Digite a senha">
<button onclick="login()">Entrar</button>
<p id="erro" style="color:red;"></p>
</div>

<!-- AVALIAÇÃO -->
<div class="card">
<h2>Avaliação Diária</h2>

<label>Nome da avaliadora:</label>
<input type="text" id="func">

<label>Turma:</label>
<select id="turma"></select>

<label>Lixo (-2 a +2)</label>
<input type="number" id="lixo" value="0">

<label>Carteiras (+3)</label>
<input type="number" id="carteiras" value="0">

<label>Quadro (+2)</label>
<input type="number" id="quadro" value="0">

<label>Varrida (+3)</label>
<input type="number" id="varrida" value="0">

<button onclick="salvar()">Salvar Pontuação</button>
</div>

<!-- ADMIN PANEL -->
<div class="card" id="adminPanel">
<h2>Painel do Administrador</h2>

<button onclick="mostrarRelatorios()">Gerar Relatórios</button>

<div id="relatorios"></div>
</div>

</div>

<script>

let dados = JSON.parse(localStorage.getItem("dados")) || [];

/* TURMAS */
let turmas = [
"6A","6B","6C","6D",
"7A","7B","7C","7D",
"8A","8B","8C","8D",
"9A","9B","9C",
"1A","1B","1C",
"2A","2B","2C",
"3A","3B","3C"
];

let sel = document.getElementById("turma");
turmas.forEach(t=>{
  let o=document.createElement("option");
  o.value=t;
  o.innerHTML=t;
  sel.appendChild(o);
});

/* SALVAR */
function salvar(){
  let pontos =
    Number(lixo.value) +
    Number(carteiras.value) +
    Number(quadro.value) +
    Number(varrida.value);

  let registro = {
    turma: turma.value,
    func: func.value,
    pontos: pontos,
    data: new Date().toISOString()
  };

  dados.push(registro);
  localStorage.setItem("dados", JSON.stringify(dados));

  alert("Salvo!");
}

/* LOGIN ADMIN */
function login(){
  let senha = document.getElementById("senha").value;

  if(senha === "2312"){
    document.getElementById("adminPanel").style.display = "block";
    document.getElementById("erro").innerText = "";
  } else {
    document.getElementById("erro").innerText = "Senha incorreta!";
  }
}

/* WEEK KEY */
function getWeek(d){
  let date = new Date(d);
  let onejan = new Date(date.getFullYear(),0,1);
  return Math.ceil((((date - onejan) / 86400000) + onejan.getDay()+1)/7);
}

/* MONTH KEY */
function getMonth(d){
  return new Date(d).getMonth()+1;
}

/* RELATÓRIOS */
function mostrarRelatorios(){

  let total = 0;
  let porMes = {};
  let porSemana = {};
  let porTurma = {};

  dados.forEach(d=>{
    let date = new Date(d.data);
    let mes = getMonth(date);
    let semana = getWeek(date);

    total += d.pontos;

    // mês
    porMes[mes] = (porMes[mes] || 0) + d.pontos;

    // semana
    porSemana[semana] = (porSemana[semana] || 0) + d.pontos;

    // turma
    porTurma[d.turma] = (porTurma[d.turma] || 0) + d.pontos;
  });

  let html = "";

  html += `<h3>Total Geral do Projeto</h3><p>${total} pontos</p>`;

  html += `<h3>Por Mês</h3>`;
  for(let m in porMes){
    html += `<p>Mês ${m}: ${porMes[m]} pontos</p>`;
  }

  html += `<h3>Por Semana</h3>`;
  for(let s in porSemana){
    html += `<p>Semana ${s}: ${porSemana[s]} pontos</p>`;
  }

  html += `<h3>Ranking por Turma</h3>`;
  for(let t in porTurma){
    html += `<p>${t}: ${porTurma[t]} pontos</p>`;
  }

  document.getElementById("relatorios").innerHTML = html;
}

</script>

</body>
</html>
